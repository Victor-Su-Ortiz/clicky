name = "clicky-proxy"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
MINIMAX_VOICE_ID = "English_FriendlyPerson"
# Which upstream serves /chat: "minimax" or "together".
# LIVE on Together serverless M3 (MiniMaxAI/MiniMax-M3) as of 2026-06-14 —
# vision verified working with the base64 screenshots the app sends (see
# NOTES.md). Flip back to "minimax" + redeploy to revert to MiniMax-direct.
# Requires the TOGETHER_API_KEY secret.
CHAT_UPSTREAM = "together"
TOGETHER_CHAT_MODEL = "MiniMaxAI/MiniMax-M3"
# Thinking mode for the Together M3 path: "disabled" (fastest, for the voice
# UX), "enabled", or "adaptive". M3 reasons by default; disabled keeps the
# reasoning latency out of the spoken critique.
TOGETHER_THINKING_MODE = "disabled"
# Which upstream serves /tts: "minimax" (default) or "together".
# The Together path serves the SAME MiniMax speech model but needs a RUNNING
# dedicated endpoint on the Together account first (~$6.49/hr while up —
# MiniMax speech is not serverless on Together). Demo-day recipe in NOTES.md:
# start the endpoint, flip this to "together", `npx wrangler deploy`; flip
# back + redeploy when the endpoint stops. Requires the TOGETHER_API_KEY secret.
TTS_UPSTREAM = "minimax"
TOGETHER_TTS_MODEL = "minimax/speech-2.8-turbo"
# Together's voice catalog for this model does NOT include MiniMax-direct ids
# like English_FriendlyPerson. English options: English_Aussie_Bloke,
# English_ManWithDeepVoice, English_radiant_girl.
TOGETHER_TTS_VOICE = "English_radiant_girl"
